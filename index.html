<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Snake Infinity</title>

<style>
/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(0,255,136,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(0,140,255,.10),
            transparent 30%
        ),
        #060a12;

    color:#fff;
    overflow-x:hidden;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    max-width:1250px;
    min-height:100vh;
    margin:auto;
    padding:
        max(14px,env(safe-area-inset-top))
        max(12px,env(safe-area-inset-right))
        max(14px,env(safe-area-inset-bottom))
        max(12px,env(safe-area-inset-left));
}

/* =========================================================
   HEADER
========================================================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:14px;
}

.brand{
    min-width:0;
}

.brand h1{
    font-size:clamp(25px,5vw,48px);
    font-weight:950;
    letter-spacing:-1.5px;
    line-height:1;

    background:
        linear-gradient(
            90deg,
            #00ff88,
            #00c8ff,
            #8b5cf6
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.brand p{
    color:#8d98aa;
    font-size:clamp(11px,2vw,14px);
    margin-top:6px;
}

/* =========================================================
   MENU BUTTON
========================================================= */

.menu-btn{
    width:48px;
    height:48px;
    flex:none;

    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;

    background:
        rgba(255,255,255,.06);

    color:#fff;
    cursor:pointer;

    font-size:22px;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:.2s;
}

.menu-btn:hover{
    border-color:#00ff88;
}

.menu-btn:active{
    transform:scale(.92);
}

/* =========================================================
   MAIN LAYOUT
========================================================= */

.main{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:14px;
}

/* =========================================================
   GAME CARD
========================================================= */

.game-card{
    position:relative;

    background:
        rgba(13,19,32,.88);

    border:1px solid rgba(255,255,255,.09);

    border-radius:24px;

    padding:10px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.35);
}

/* =========================================================
   BOARD
========================================================= */

.board-wrap{
    position:relative;

    width:100%;

    /*
      Board automatically adapts to screen.
    */
    height:min(
        70vh,
        calc(100vw - 32px),
        720px
    );

    min-height:280px;

    display:flex;
    justify-content:center;
    align-items:center;
}

#gameCanvas{
    display:block;

    width:100%;
    height:100%;

    max-width:720px;

    background:#03070e;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.07);

    box-shadow:
        inset 0 0 50px rgba(0,0,0,.65),
        0 10px 35px rgba(0,0,0,.35);
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay{
    position:absolute;
    inset:0;

    border-radius:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

    background:
        rgba(2,6,14,.84);

    backdrop-filter:blur(7px);

    z-index:20;
}

.overlay.hidden{
    display:none;
}

.overlay-box{
    width:min(380px,90%);
}

.overlay-box h2{
    font-size:clamp(26px,7vw,48px);
    margin-bottom:9px;
}

.overlay-box p{
    color:#929caf;
    line-height:1.5;
    margin-bottom:18px;
}

.start-btn{
    border:0;
    border-radius:14px;

    padding:14px 25px;

    background:
        linear-gradient(
            135deg,
            #00c853,
            #00ff88
        );

    color:#00190d;

    font-size:15px;
    font-weight:850;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(0,255,136,.2);

    transition:.2s;
}

.start-btn:active{
    transform:scale(.94);
}

/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;

    margin-top:10px;
}

.stat{
    min-width:0;

    padding:11px 7px;

    text-align:center;

    background:
        rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.07);

    border-radius:14px;
}

.stat small{
    display:block;
    color:#7f8999;
    font-size:9px;
    letter-spacing:.7px;
    margin-bottom:4px;
}

.stat strong{
    font-size:clamp(15px,4vw,21px);
}

/* =========================================================
   FIXED CONTROL AREA
========================================================= */

.controls-bar{
    position:relative;

    margin-top:10px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:8px;

    border-radius:17px;

    background:
        rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.07);
}

/* =========================================================
   D PAD
========================================================= */

.dpad{
    width:150px;
    height:105px;

    display:grid;

    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);

    gap:6px;

    flex:none;
}

.d-btn{
    border:1px solid rgba(255,255,255,.1);

    background:
        linear-gradient(
            145deg,
            #182235,
            #0b111e
        );

    color:#fff;

    border-radius:11px;

    font-size:18px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 5px 12px rgba(0,0,0,.25);

    transition:.08s;

    touch-action:manipulation;
}

.d-btn:active,
.d-btn.active{
    transform:scale(.88);

    background:#00ff88;
    color:#00170c;

    border-color:#00ff88;
}

.up{
    grid-column:2;
}

.left{
    grid-column:1;
    grid-row:2;
}

.down{
    grid-column:2;
    grid-row:2;
}

.right{
    grid-column:3;
    grid-row:2;
}

/* =========================================================
   CONTROL INFO
========================================================= */

.control-info{
    flex:1;
    min-width:0;
}

.control-info strong{
    display:block;
    font-size:14px;
}

.control-info span{
    display:block;
    color:#7f8999;
    font-size:11px;
    margin-top:5px;
}

/* =========================================================
   ACTION BUTTONS
========================================================= */

.actions{
    display:flex;
    gap:6px;
}

.action-btn{
    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.08);

    border-radius:11px;

    background:
        rgba(255,255,255,.06);

    color:#fff;

    cursor:pointer;

    font-size:16px;
}

.action-btn:active{
    transform:scale(.9);
}

/* =========================================================
   SETTINGS PANEL
========================================================= */

.settings{
    position:fixed;

    top:0;
    right:0;

    width:min(370px,92vw);
    height:100dvh;

    z-index:100;

    background:
        rgba(9,14,25,.97);

    border-left:1px solid rgba(255,255,255,.1);

    box-shadow:
        -20px 0 60px rgba(0,0,0,.45);

    padding:
        20px
        max(18px,env(safe-area-inset-right))
        25px
        20px;

    overflow-y:auto;

    transform:translateX(105%);

    transition:
        transform .3s cubic-bezier(.2,.8,.2,1);
}

.settings.open{
    transform:translateX(0);
}

.settings-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:18px;
}

.settings-head h2{
    font-size:21px;
}

.close-settings{
    width:40px;
    height:40px;

    border:1px solid rgba(255,255,255,.1);
    border-radius:11px;

    background:rgba(255,255,255,.06);

    color:#fff;

    cursor:pointer;
}

/* =========================================================
   ACCORDION
========================================================= */

.accordion{
    margin-bottom:10px;

    border:1px solid rgba(255,255,255,.08);

    border-radius:16px;

    overflow:hidden;

    background:
        rgba(255,255,255,.035);
}

.accordion-head{
    width:100%;

    border:0;

    background:transparent;

    color:#fff;

    padding:16px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    cursor:pointer;

    font-weight:800;

    text-align:left;
}

.arrow{
    transition:.25s;
}

.accordion.active .arrow{
    transform:rotate(180deg);
}

.accordion-body{
    display:none;

    padding:0 12px 13px;
}

.accordion.active .accordion-body{
    display:block;
}

/* =========================================================
   DIFFICULTY OPTIONS
========================================================= */

.level-option{
    width:100%;

    padding:13px;

    margin-top:7px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.045);

    color:#fff;

    cursor:pointer;

    text-align:left;

    transition:.18s;
}

.level-option:hover{
    border-color:rgba(0,255,136,.5);
}

.level-option.selected{
    border-color:#00ff88;

    background:
        rgba(0,255,136,.08);

    box-shadow:
        inset 0 0 20px rgba(0,255,136,.04);
}

.level-option b{
    display:block;
    font-size:14px;
}

.level-option span{
    display:block;
    color:#808b9d;
    font-size:10px;
    margin-top:4px;
}

/* =========================================================
   CUSTOMIZATION
========================================================= */

.color-line{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:8px 3px;

    font-size:13px;
}

.color-input{
    width:52px;
    height:34px;

    padding:2px;

    border:1px solid rgba(255,255,255,.1);

    border-radius:8px;

    background:transparent;

    cursor:pointer;
}

/* =========================================================
   SWITCH
========================================================= */

.switch-line{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:7px;

    padding:13px;

    border-radius:12px;

    background:
        rgba(255,255,255,.045);
}

.switch{
    position:relative;

    width:46px;
    height:25px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;

    border-radius:30px;

    background:#303846;

    cursor:pointer;
}

.slider:before{
    content:"";

    position:absolute;

    width:19px;
    height:19px;

    left:3px;
    top:3px;

    border-radius:50%;

    background:#fff;

    transition:.2s;
}

.switch input:checked + .slider{
    background:#00d978;
}

.switch input:checked + .slider:before{
    transform:translateX(21px);
}

/* =========================================================
   SETTINGS BACKDROP
========================================================= */

.settings-backdrop{
    position:fixed;
    inset:0;

    z-index:90;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(2px);

    opacity:0;
    pointer-events:none;

    transition:.25s;
}

.settings-backdrop.show{
    opacity:1;
    pointer-events:auto;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    top:15px;

    transform:
        translate(-50%,-100px);

    z-index:200;

    padding:11px 17px;

    border-radius:12px;

    background:
        rgba(15,23,38,.96);

    border:1px solid rgba(255,255,255,.1);

    font-size:12px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    transition:.3s;
}

.toast.show{
    transform:
        translate(-50%,0);
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:900px){

    .main{
        grid-template-columns:minmax(0,1fr);
    }

    .game-card{
        padding:14px;
    }

    .board-wrap{
        height:min(
            72vh,
            720px
        );
    }

}

/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:500px){

    .app{
        padding-left:8px;
        padding-right:8px;
    }

    .header{
        margin-bottom:8px;
    }

    .brand h1{
        font-size:27px;
    }

    .brand p{
        font-size:10px;
    }

    .menu-btn{
        width:43px;
        height:43px;
    }

    .game-card{
        padding:7px;
        border-radius:19px;
    }

    .board-wrap{
        height:
            min(
                60vh,
                calc(100vw - 30px)
            );

        min-height:260px;
    }

    .stats{
        gap:6px;
    }

    .stat{
        padding:9px 5px;
    }

    .controls-bar{
        padding:7px;
    }

    .dpad{
        width:130px;
        height:92px;
    }

    .d-btn{
        font-size:16px;
    }

    .control-info{
        display:none;
    }

    .action-btn{
        width:40px;
        height:40px;
    }

}

/* =========================================================
   VERY SMALL DEVICES
========================================================= */

@media(max-height:650px){

    .board-wrap{
        height:52vh;
        min-height:220px;
    }

}

/* =========================================================
   LANDSCAPE MOBILE
========================================================= */

@media(
    max-height:500px
) and (
    orientation:landscape
){

    .board-wrap{
        height:72vh;
        min-height:200px;
    }

    .header{
        margin-bottom:5px;
    }

    .stats{
        margin-top:5px;
    }

    .controls-bar{
        margin-top:5px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <h1>🐍 SNAKE INFINITY</h1>

            <p>
                Classic Snake • Modern Experience
            </p>

        </div>

        <button
            class="menu-btn"
            id="menuBtn"
            aria-label="Open settings">

            ☰

        </button>

    </header>


    <!-- MAIN -->

    <main class="main">

        <section class="game-card">

            <!-- BOARD -->

            <div class="board-wrap">

                <canvas id="gameCanvas"></canvas>


                <!-- OVERLAY -->

                <div
                    class="overlay"
                    id="overlay">

                    <div class="overlay-box">

                        <h2 id="overlayTitle">
                            🐍 Ready?
                        </h2>

                        <p id="overlayMessage">
                            Choose a difficulty and start your game.
                        </p>

                        <button
                            class="start-btn"
                            id="startBtn">

                            Start Game

                        </button>

                    </div>

                </div>

            </div>


            <!-- STATS -->

            <div class="stats">

                <div class="stat">
                    <small>SCORE</small>
                    <strong id="score">0</strong>
                </div>

                <div class="stat">
                    <small>HIGH SCORE</small>
                    <strong id="highScore">0</strong>
                </div>

                <div class="stat">
                    <small>LEVEL</small>
                    <strong id="level">1</strong>
                </div>

                <div class="stat">
                    <small>SPEED</small>
                    <strong id="speed">1x</strong>
                </div>

            </div>


            <!-- FIXED CONTROL AREA -->

            <div class="controls-bar">

                <div class="dpad">

                    <button
                        class="d-btn up"
                        data-dir="up">
                        W
                    </button>

                    <button
                        class="d-btn left"
                        data-dir="left">
                        A
                    </button>

                    <button
                        class="d-btn down"
                        data-dir="down">
                        S
                    </button>

                    <button
                        class="d-btn right"
                        data-dir="right">
                        D
                    </button>

                </div>


                <div class="control-info">

                    <strong>
                        W A S D Controls
                    </strong>

                    <span>
                        Tap buttons or use your keyboard
                    </span>

                </div>


                <div class="actions">

                    <button
                        class="action-btn"
                        id="pauseBtn"
                        title="Pause">

                        ⏸️

                    </button>

                    <button
                        class="action-btn"
                        id="restartBtn"
                        title="Restart">

                        🔄

                    </button>

                    <button
                        class="action-btn"
                        id="soundBtn"
                        title="Sound">

                        🔊

                    </button>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- SETTINGS BACKDROP -->

<div
    class="settings-backdrop"
    id="settingsBackdrop">
</div>


<!-- SETTINGS -->

<aside
    class="settings"
    id="settings">

    <div class="settings-head">

        <h2>⚙️ Settings</h2>

        <button
            class="close-settings"
            id="closeSettings">

            ✕

        </button>

    </div>


    <!-- DIFFICULTY -->

    <div
        class="accordion active"
        id="difficultyAccordion">

        <button
            class="accordion-head">

            <span>
                🎮 Difficulty
            </span>

            <span class="arrow">
                ▼
            </span>

        </button>


        <div class="accordion-body">

            <button
                class="level-option selected"
                data-level="easy">

                <b>🟢 Level 1 — Easy</b>

                <span>
                    Slow speed • Beginner friendly
                </span>

            </button>


            <button
                class="level-option"
                data-level="medium">

                <b>🟡 Level 2 — Medium</b>

                <span>
                    Faster speed • Obstacles
                </span>

            </button>


            <button
                class="level-option"
                data-level="hard">

                <b>🔴 Level 3 — Hard</b>

                <span>
                    High speed • More obstacles
                </span>

            </button>


            <button
                class="level-option"
                data-level="infinity">

                <b>♾️ Infinity</b>

                <span>
                    Endless progression
                </span>

            </button>

        </div>

    </div>


    <!-- CUSTOMIZATION -->

    <div class="accordion">

        <button
            class="accordion-head">

            <span>
                🎨 Snake Customization
            </span>

            <span class="arrow">
                ▼
            </span>

        </button>


        <div class="accordion-body">

            <div class="color-line">

                <span>
                    Snake Color
                </span>

                <input
                    type="color"
                    id="color1"
                    class="color-input"
                    value="#00ff88">

            </div>


            <div class="color-line">

                <span>
                    Gradient Color
                </span>

                <input
                    type="color"
                    id="color2"
                    class="color-input"
                    value="#008cff">

            </div>


            <div class="switch-line">

                <span>
                    🌈 Gradient Snake
                </span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="gradient"
                        checked>

                    <span class="slider"></span>

                </label>

            </div>

        </div>

    </div>

</aside>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>


<script>
/* =========================================================
   SNAKE INFINITY
   ALL JAVASCRIPT
========================================================= */


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const scoreEl =
    document.getElementById("score");

const highScoreEl =
    document.getElementById("highScore");

const levelEl =
    document.getElementById("level");

const speedEl =
    document.getElementById("speed");

const overlay =
    document.getElementById("overlay");

const overlayTitle =
    document.getElementById("overlayTitle");

const overlayMessage =
    document.getElementById("overlayMessage");

const startBtn =
    document.getElementById("startBtn");

const pauseBtn =
    document.getElementById("pauseBtn");

const restartBtn =
    document.getElementById("restartBtn");

const soundBtn =
    document.getElementById("soundBtn");

const menuBtn =
    document.getElementById("menuBtn");

const closeSettings =
    document.getElementById("closeSettings");

const settings =
    document.getElementById("settings");

const settingsBackdrop =
    document.getElementById("settingsBackdrop");

const toast =
    document.getElementById("toast");

const color1 =
    document.getElementById("color1");

const color2 =
    document.getElementById("color2");

const gradient =
    document.getElementById("gradient");


/* =========================================================
   GAME CONSTANTS
========================================================= */

const GRID = 25;


/* =========================================================
   GAME STATE
========================================================= */

let snake = [];

let food = {
    x:10,
    y:10
};

let obstacles = [];

let direction = {
    x:1,
    y:0
};

let nextDirection = {
    x:1,
    y:0
};

let score = 0;

let highScore =
    Number(
        localStorage.getItem("snakeHighScore") || 0
    );

let currentLevel = "easy";

let running = false;

let paused = false;

let timer = null;

let tile = 10;

let soundOn = true;

let infinityLevel = 1;

let currentDelay = 160;


/* =========================================================
   DIFFICULTY
========================================================= */

const modes = {

    easy:{
        delay:170,
        obstacles:0
    },

    medium:{
        delay:125,
        obstacles:5
    },

    hard:{
        delay:85,
        obstacles:10
    },

    infinity:{
        delay:150,
        obstacles:2
    }

};


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    const size =
        Math.max(
            220,
            Math.floor(
                Math.min(
                    rect.width,
                    rect.height
                )
            )
        );

    /*
      Use square internal canvas.
    */

    canvas.width = size;
    canvas.height = size;

    tile =
        canvas.width / GRID;

    draw();
}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   START POSITION
========================================================= */

function resetGame(){

    snake = [

        {x:12,y:12},

        {x:11,y:12},

        {x:10,y:12}

    ];

    direction = {
        x:1,
        y:0
    };

    nextDirection = {
        x:1,
        y:0
    };

    score = 0;

    infinityLevel = 1;

    currentDelay =
        modes[currentLevel].delay;

    obstacles = [];

    createObstacles(
        modes[currentLevel].obstacles
    );

    spawnFood();

    paused = false;

    updateUI();

    draw();
}


/* =========================================================
   START
========================================================= */

function startGame(){

    resetGame();

    running = true;

    hideOverlay();

    startLoop();

    showToast("🐍 Game Started!");

    beep(500,.08);
}


/* =========================================================
   LOOP
========================================================= */

function startLoop(){

    clearInterval(timer);

    timer =
        setInterval(
            tick,
            currentDelay
        );
}


function tick(){

    if(!running || paused){
        return;
    }

    moveSnake();

    draw();
}


/* =========================================================
   MOVE SNAKE
========================================================= */

function moveSnake(){

    direction =
        {...nextDirection};


    const head = {

        x:
            snake[0].x + direction.x,

        y:
            snake[0].y + direction.y

    };


    /* WALL */

    if(
        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID
    ){

        gameOver("💥 You hit the wall!");

        return;
    }


    /* SELF */

    if(
        snake.some(
            segment =>
                segment.x === head.x &&
                segment.y === head.y
        )
    ){

        gameOver("🐍 You hit yourself!");

        return;
    }


    /* OBSTACLE */

    if(
        obstacles.some(
            obstacle =>
                obstacle.x === head.x &&
                obstacle.y === head.y
        )
    ){

        gameOver("🧱 You hit an obstacle!");

        return;
    }


    /*
      IMPORTANT:
      New head is added every move.
    */

    snake.unshift(head);


    /* FOOD */

    const ateFood =
        head.x === food.x &&
        head.y === food.y;


    if(ateFood){

        /*
          DO NOT remove tail.

          Therefore snake grows by exactly
          ONE segment.
        */

        score += 10;

        spawnFood();

        beep(750,.06);

        handleProgress();

    }else{

        /*
          Normal movement:
          remove one tail segment.
        */

        snake.pop();

    }


    updateUI();
}


/* =========================================================
   DIRECTION
========================================================= */

function changeDirection(dir){

    if(!running || paused){
        return;
    }


    let newDirection;


    if(dir === "up"){

        newDirection = {
            x:0,
            y:-1
        };

    }

    if(dir === "down"){

        newDirection = {
            x:0,
            y:1
        };

    }

    if(dir === "left"){

        newDirection = {
            x:-1,
            y:0
        };

    }

    if(dir === "right"){

        newDirection = {
            x:1,
            y:0
        };

    }


    /*
      Prevent direct reverse.
    */

    if(
        newDirection.x === -direction.x &&
        newDirection.y === -direction.y
    ){
        return;
    }


    nextDirection =
        newDirection;

    animateControl(dir);
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if(
            ["w","a","s","d"," "]
            .includes(key)
        ){
            event.preventDefault();
        }


        if(key === "w"){
            changeDirection("up");
        }

        else if(key === "a"){
            changeDirection("left");
        }

        else if(key === "s"){
            changeDirection("down");
        }

        else if(key === "d"){
            changeDirection("right");
        }

        else if(key === " "){
            togglePause();
        }

        else if(key === "r"){
            restartGame();
        }

    }
);


/* =========================================================
   TOUCH BUTTONS
========================================================= */

document
    .querySelectorAll(".d-btn")
    .forEach(button => {

        const action = () => {

            changeDirection(
                button.dataset.dir
            );

        };


        button.addEventListener(
            "pointerdown",
            action
        );

    });


function animateControl(dir){

    const button =
        document.querySelector(
            `[data-dir="${dir}"]`
        );

    if(!button){
        return;
    }

    button.classList.add("active");

    setTimeout(
        () =>
            button.classList.remove("active"),
        100
    );
}


/* =========================================================
   FOOD
========================================================= */

function spawnFood(){

    let valid = false;

    while(!valid){

        food = {

            x:
                Math.floor(
                    Math.random() * GRID
                ),

            y:
                Math.floor(
                    Math.random() * GRID
                )

        };


        valid = true;


        if(
            snake.some(
                s =>
                    s.x === food.x &&
                    s.y === food.y
            )
        ){

            valid = false;
            continue;
        }


        if(
            obstacles.some(
                o =>
                    o.x === food.x &&
                    o.y === food.y
            )
        ){

            valid = false;
        }

    }
}


/* =========================================================
   OBSTACLES
========================================================= */

function createObstacles(count){

    obstacles = [];

    let attempts = 0;


    while(
        obstacles.length < count &&
        attempts < 1000
    ){

        attempts++;


        const item = {

            x:
                Math.floor(
                    Math.random() * GRID
                ),

            y:
                Math.floor(
                    Math.random() * GRID
                )

        };


        let valid = true;


        if(
            snake.some(
                s =>
                    s.x === item.x &&
                    s.y === item.y
            )
        ){
            valid = false;
        }


        if(
            item.x === food.x &&
            item.y === food.y
        ){
            valid = false;
        }


        if(
            obstacles.some(
                o =>
                    o.x === item.x &&
                    o.y === item.y
            )
        ){
            valid = false;
        }


        if(valid){
            obstacles.push(item);
        }

    }
}


/* =========================================================
   PROGRESSION
========================================================= */

function handleProgress(){

    /*
      Speed increases every 50 points.
    */

    if(
        score > 0 &&
        score % 50 === 0
    ){

        if(currentDelay > 45){

            currentDelay -= 8;

            startLoop();

        }

        showToast("⚡ Speed Increased!");

    }


    /*
      Infinity:
      add obstacle + increase difficulty.
    */

    if(
        currentLevel === "infinity" &&
        score > 0 &&
        score % 100 === 0
    ){

        infinityLevel++;

        if(currentDelay > 40){

            currentDelay -= 7;

            startLoop();

        }

        createOneInfinityObstacle();

        showToast(
            `♾️ Infinity Level ${infinityLevel}`
        );

    }
}


function createOneInfinityObstacle(){

    let attempts = 0;

    while(attempts < 500){

        attempts++;

        const item = {

            x:
                Math.floor(
                    Math.random() * GRID
                ),

            y:
                Math.floor(
                    Math.random() * GRID
                )

        };


        const occupied =
            snake.some(
                s =>
                    s.x === item.x &&
                    s.y === item.y
            );


        const foodSpot =
            item.x === food.x &&
            item.y === food.y;


        const obstacleSpot =
            obstacles.some(
                o =>
                    o.x === item.x &&
                    o.y === item.y
            );


        if(
            !occupied &&
            !foodSpot &&
            !obstacleSpot
        ){

            obstacles.push(item);

            return;
        }

    }
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    if(!tile){
        return;
    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Background */

    ctx.fillStyle =
        "#03070e";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawGrid();

    drawObstacles();

    drawFood();

    drawSnake();

}


/* =========================================================
   GRID
========================================================= */

function drawGrid(){

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";

    ctx.lineWidth = 1;


    for(
        let i=0;
        i<=GRID;
        i++
    ){

        const pos =
            i * tile;


        ctx.beginPath();

        ctx.moveTo(
            pos,
            0
        );

        ctx.lineTo(
            pos,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            pos
        );

        ctx.lineTo(
            canvas.width,
            pos
        );

        ctx.stroke();

    }
}


/* =========================================================
   SNAKE
========================================================= */

function drawSnake(){

    let fill;


    if(gradient.checked){

        fill =
            ctx.createLinearGradient(
                0,
                0,
                canvas.width,
                canvas.height
            );

        fill.addColorStop(
            0,
            color1.value
        );

        fill.addColorStop(
            1,
            color2.value
        );

    }else{

        fill =
            color1.value;

    }


    snake.forEach(
        (part,index) => {

            const gap = 2;

            const x =
                part.x * tile + gap;

            const y =
                part.y * tile + gap;

            const size =
                tile - gap * 2;


            ctx.fillStyle = fill;

            ctx.shadowBlur =
                index === 0 ? 18 : 7;

            ctx.shadowColor =
                color1.value;


            roundRect(
                ctx,
                x,
                y,
                size,
                size,
                Math.max(
                    4,
                    tile * .18
                )
            );

            ctx.fill();

            ctx.shadowBlur = 0;


            if(index === 0){

                drawEyes(
                    x,
                    y,
                    size
                );

            }

        }
    );
}


/* =========================================================
   EYES
========================================================= */

function drawEyes(x,y,size){

    ctx.fillStyle="#fff";

    const r =
        Math.max(
            2,
            size * .11
        );


    let e1;
    let e2;


    if(direction.x !== 0){

        e1 = {
            x:x + size*.68,
            y:y + size*.28
        };

        e2 = {
            x:x + size*.68,
            y:y + size*.72
        };

    }else{

        e1 = {
            x:x + size*.28,
            y:y + size*.30
        };

        e2 = {
            x:x + size*.72,
            y:y + size*.30
        };

    }


    ctx.beginPath();

    ctx.arc(
        e1.x,
        e1.y,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        e2.x,
        e2.y,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================================================
   FOOD
========================================================= */

function drawFood(){

    const x =
        food.x * tile +
        tile/2;

    const y =
        food.y * tile +
        tile/2;

    const radius =
        tile * .27;


    ctx.shadowBlur = 18;

    ctx.shadowColor =
        "#ff3151";

    ctx.fillStyle =
        "#ff3151";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.fillStyle=
        "rgba(255,255,255,.75)";


    ctx.beginPath();

    ctx.arc(
        x-radius*.3,
        y-radius*.3,
        radius*.22,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================================================
   OBSTACLES DRAW
========================================================= */

function drawObstacles(){

    obstacles.forEach(
        obstacle => {

            const gap=3;

            const x =
                obstacle.x * tile + gap;

            const y =
                obstacle.y * tile + gap;

            const size =
                tile - gap*2;


            ctx.fillStyle =
                "#8b5cf6";

            ctx.shadowBlur=10;

            ctx.shadowColor =
                "#8b5cf6";


            roundRect(
                ctx,
                x,
                y,
                size,
                size,
                5
            );

            ctx.fill();

            ctx.shadowBlur=0;

        }
    );
}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
){

    context.beginPath();

    context.moveTo(
        x+radius,
        y
    );

    context.lineTo(
        x+width-radius,
        y
    );

    context.quadraticCurveTo(
        x+width,
        y,
        x+width,
        y+radius
    );

    context.lineTo(
        x+width,
        y+height-radius
    );

    context.quadraticCurveTo(
        x+width,
        y+height,
        x+width-radius,
        y+height
    );

    context.lineTo(
        x+radius,
        y+height
    );

    context.quadraticCurveTo(
        x,
        y+height,
        x,
        y+height-radius
    );

    context.lineTo(
        x,
        y+radius
    );

    context.quadraticCurveTo(
        x,
        y,
        x+radius,
        y
    );

    context.closePath();
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(message){

    running=false;

    paused=false;

    clearInterval(timer);


    if(score > highScore){

        highScore=score;

        localStorage.setItem(
            "snakeHighScore",
            highScore
        );

        message +=
            "<br>🏆 NEW HIGH SCORE!";

    }


    overlayTitle.textContent =
        "💀 Game Over";

    overlayMessage.innerHTML =
        `${message}<br><br>
         Score: <b>${score}</b><br>
         High Score: <b>${highScore}</b>`;


    startBtn.textContent =
        "🔄 Play Again";


    overlay.classList.remove(
        "hidden"
    );


    updateUI();

    beep(180,.25);
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(!running){
        return;
    }


    paused=!paused;


    if(paused){

        pauseBtn.textContent="▶️";

        overlayTitle.textContent=
            "⏸️ Paused";

        overlayMessage.textContent=
            "Press Resume or Space to continue.";

        startBtn.textContent=
            "▶️ Resume";

        overlay.classList.remove(
            "hidden"
        );

    }else{

        pauseBtn.textContent="⏸️";

        hideOverlay();

    }
}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    clearInterval(timer);

    running=false;

    resetGame();

    running=true;

    hideOverlay();

    startLoop();

    showToast("🔄 Restarted!");

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    scoreEl.textContent =
        score;

    highScoreEl.textContent =
        highScore;


    if(currentLevel === "infinity"){

        levelEl.textContent =
            "∞ " + infinityLevel;

    }else{

        const nums={
            easy:1,
            medium:2,
            hard:3
        };

        levelEl.textContent =
            nums[currentLevel];

    }


    const speedValue =
        Math.max(
            1,
            (170/currentDelay)
                .toFixed(1)
        );

    speedEl.textContent =
        speedValue+"x";
}


/* =========================================================
   OVERLAY
========================================================= */

function hideOverlay(){

    overlay.classList.add(
        "hidden"
    );
}


/* =========================================================
   START BUTTON
========================================================= */

startBtn.addEventListener(
    "click",
    () => {

        if(paused){

            togglePause();

        }else{

            startGame();

        }

    }
);


/* =========================================================
   PAUSE / RESTART / SOUND
========================================================= */

pauseBtn.addEventListener(
    "click",
    togglePause
);


restartBtn.addEventListener(
    "click",
    restartGame
);


soundBtn.addEventListener(
    "click",
    () => {

        soundOn=!soundOn;

        soundBtn.textContent =
            soundOn
                ? "🔊"
                : "🔇";

    }
);


/* =========================================================
   SETTINGS OPEN/CLOSE
========================================================= */

function openSettings(){

    settings.classList.add(
        "open"
    );

    settingsBackdrop.classList.add(
        "show"
    );
}


function closeSettingsPanel(){

    settings.classList.remove(
        "open"
    );

    settingsBackdrop.classList.remove(
        "show"
    );
}


menuBtn.addEventListener(
    "click",
    openSettings
);


closeSettings.addEventListener(
    "click",
    closeSettingsPanel
);


settingsBackdrop.addEventListener(
    "click",
    closeSettingsPanel
);


/* =========================================================
   ACCORDIONS
========================================================= */

document
    .querySelectorAll(".accordion-head")
    .forEach(head => {

        head.addEventListener(
            "click",
            () => {

                const parent =
                    head.parentElement;

                parent.classList.toggle(
                    "active"
                );

            }
        );

    });


/* =========================================================
   DIFFICULTY SELECT
========================================================= */

document
    .querySelectorAll(".level-option")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".level-option")
                    .forEach(
                        item =>
                            item.classList.remove(
                                "selected"
                            )
                    );


                button.classList.add(
                    "selected"
                );


                currentLevel =
                    button.dataset.level;


                /*
                  If game is running,
                  restart with new difficulty.
                */

                restartGame();

                showToast(
                    button
                        .querySelector("b")
                        .textContent
                );

            }
        );

    });


/* =========================================================
   CUSTOMIZATION
========================================================= */

color1.addEventListener(
    "input",
    draw
);

color2.addEventListener(
    "input",
    draw
);

gradient.addEventListener(
    "change",
    draw
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1600
        );
}


/* =========================================================
   SOUND
========================================================= */

let audioContext=null;


function beep(
    frequency,
    duration
){

    if(!soundOn){
        return;
    }


    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type="sine";

        oscillator.frequency.value=
            frequency;


        gain.gain.setValueAtTime(
            .05,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime+
            duration
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime+
            duration
        );

    }catch(e){}

}


/* =========================================================
   INITIALIZE
========================================================= */

highScoreEl.textContent =
    highScore;

resetGame();

requestAnimationFrame(
    resizeCanvas
);

</script>
